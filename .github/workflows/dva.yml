# Cloud runner: your Mac can stay off. Every ~10 minutes (daytime IST) this job wakes up, handles your
# Telegram messages / Drive uploads, sends the 9 AM prompts, publishes your videos, collects metrics.
# Setup: docs/CLOUD.md (one-time `scripts/setup_cloud.sh` on any computer).
name: dva

on:
  schedule:
    - cron: "*/10 3-19 * * *"        # every 10 min, 08:30 – 01:30 IST
    - cron: "17 20-23,0-2 * * *"     # hourly at night
  workflow_dispatch:                 # "Run workflow" button (works from the GitHub phone app too)
    inputs:
      command:
        description: "poll (normal pass) | run (new topic now) | metrics"
        default: poll
        required: true

permissions:
  contents: write                    # to save the encrypted state on the dva-state branch

concurrency:
  group: dva-state                   # one job at a time: the state is never written by two jobs
  cancel-in-progress: false

jobs:
  dva:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DVA__CLOUD__ENABLED: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      DVA_DRIVE_FOLDER_ID: ${{ secrets.DVA_DRIVE_FOLDER_ID }}
      DVA_STATE_KEY: ${{ secrets.DVA_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -q -e .

      - name: Restore state (encrypted)
        run: bash scripts/cloud_state.sh pull

      - name: Write Google credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          umask 077; mkdir -p secrets
          [ -n "$YOUTUBE_CLIENT_SECRET_JSON" ] && printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json || true
          [ -n "$YOUTUBE_TOKEN_JSON" ] && printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json || true

      - name: Anything to do?
        id: check
        if: github.event_name == 'schedule' || inputs.command == 'poll'
        run: python -m dva poll --check

      - name: Install ffmpeg
        if: steps.check.outputs.work == 'true' || github.event_name == 'workflow_dispatch'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Work
        if: steps.check.outputs.work == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.command || 'poll' }}" in
            run)     python -m dva run --force ;;
            metrics) python -m dva metrics ;;
            *)       python -m dva poll ;;
          esac

      - name: Save state (encrypted)
        if: always() && (steps.check.outputs.work == 'true' || github.event_name == 'workflow_dispatch')
        run: bash scripts/cloud_state.sh push
